# 必读！！！
# OpenClash / Mihomo 优化版：保留原有分流结构，改善 Fake-IP、规则命中与健康检查负载
# 机场订阅
proxy-providers:
  Bigme:
    url: "https://api0.bigmelook.com/BigME/Subscription/api/v1/client/subscribe?token=f7b8cc56fc597dff98080d909ff5cdfd&rule=1"
    type: http
    interval: 0
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
  Shadowsocks.com:
    url: "https://s2.trojanflare.one/clashx/7943d975-3879-44d5-8568-57da1082ffd2"
    type: http
    interval: 0
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己手动名字调整筛选关键字。
# 没有再使用锚点和icon图标，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 📹 YouTube, type: select, proxies: [♻️ 美国自动, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🍀 Google, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🤖 AI, type: select, proxies: [🇺🇲 美国手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🌐 全部节点]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🐬 OneDrive, type: select, proxies: [♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,♻️ 香港自动, 🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🪟 Microsoft, type: select, proxies: [♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 香港自动, 🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🎵 TikTok, type: select, proxies: [♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 香港自动, 🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 📲 Telegram, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🎥 NETFLIX, type: select, proxies: [♻️ 狮城自动,♻️ 香港自动, ♻️ 日本自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 💶 PayPal, type: select, proxies: [♻️ 日本自动,  ♻️ 香港自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动,  🇭🇰 香港手动, 🇯🇵 日本手动, 🇸🇬 狮城手动, 🇺🇲 美国手动, 🌐 全部节点, 直连]}
  - {name: 🇭🇰 香港手动, type: select, include-all: true, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇯🇵 日本手动, type: select, include-all: true, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: 🇸🇬 狮城手动, type: select, include-all: true, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$"}
  - {name: 🇺🇲 美国手动, type: select, include-all: true, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"}
  - {name: ♻️ 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 86400, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 86400, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"}
  - {name: ♻️ 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 86400, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|韩|日|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 86400, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true}

rules:
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,private_domain,直连
  - DOMAIN-SUFFIX,spacex.com,🤖 AI
  - DOMAIN-SUFFIX,starlink.com,🤖 AI
  - RULE-SET,ai,🤖 AI
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,直连
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,apple_ip,直连
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,netflix_ip,🎥 NETFLIX
